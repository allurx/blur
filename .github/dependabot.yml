version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 3
    groups:
      routine-updates:
        update-types: [minor, patch]
        exclude-patterns: ["allurx/allurx-build*"]
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    target-branch: dev
    open-pull-requests-limit: 5
    groups:
      routine-updates:
        update-types: [minor, patch]
        exclude-patterns: ["io.allurx:maven-parent"]
