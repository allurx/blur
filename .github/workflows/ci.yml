name: CI
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: allurx/allurx-build/.github/workflows/maven-ci.yml@71684ece317c5344be9f5dae18f2512c88bc56b1 # v1.0.0
