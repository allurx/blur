name: CI
on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    uses: allurx/allurx-build/.github/workflows/maven-ci.yml@79ef08b3ae6b3b124bb9208199df562fd8107353 # workflows-v2.0.0
